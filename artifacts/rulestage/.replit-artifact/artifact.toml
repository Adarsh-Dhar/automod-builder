kind = "web"
previewPath = "/"
title = "RuleStage"
version = "1.0.0"
id = "artifacts/rulestage"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22143

[services.development]
run = "pnpm --filter @workspace/rulestage run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rulestage", "run", "build" ]
publicDir = "artifacts/rulestage/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22143"
BASE_PATH = "/"
