  <body>
    <div id="root"></div>
    <script>
      // Fallback handshake: keep nudging the host until the bridge answers.
      (function () {
        if (!window.parent || window.parent === window) return;

        var attempts = 0;
        var timer = null;

        function postReady() {
          try {
            window.parent.postMessage(
              { type: "devvit-message", data: { message: { type: "APP_READY" } } },
              "*"
            );
          } catch (e) {
            // best effort only
          }

          attempts += 1;
          if (attempts < 20) {
            timer = window.setTimeout(postReady, 250);
          }
        }

        function stopOnResponse(event) {
          if (event && event.data && event.data.type === "devvit-message") {
            if (timer) window.clearTimeout(timer);
            window.removeEventListener("message", stopOnResponse);
          }
        }

        window.addEventListener("message", stopOnResponse);
        postReady();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
